<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>کادو از طرفِ یه دوست</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@500;700&family=Lemonada:wght@500;700&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{
  color-scheme:light;
  --sky:#FFF3E4; --paper:#FFFFFF; --ink:#3B2A4F; --soft:#7A6A8C;
  --pink:#FF8FB1; --pink-2:#FFE0EA; --sun:#FFC93C; --sun-2:#FFF1C7;
  --mint:#5CCFB0; --mint-2:#D9F6EE; --line:#F0DCCB; --shadow:0 6px 0 #F0DCCB; --chip:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;
    --sky:#1E1830; --paper:#2A2240; --ink:#FBEFFF; --soft:#C3B4D6;
    --pink-2:#4A2B45; --sun-2:#4A3D22; --mint-2:#1F4039; --line:#3D3258; --shadow:0 6px 0 #15101F; --chip:#332A4D;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.85;
  padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 40px);min-height:100vh}
.wrap{max-width:1100px;margin-inline:auto;display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:860px){.wrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}}
h1,h2{font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;font-weight:400;margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:42px;color:var(--pink)} h2{font-size:30px}
p{margin:0}.muted{color:var(--soft);font-size:15px}.lead{font-size:19px}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pink));border-radius:9px;transition:width .4s}
.who{font-size:13px;font-weight:800;padding:3px 12px;border-radius:99px;border:2px solid var(--line);background:var(--paper);white-space:nowrap}
.who.kid{background:var(--pink-2);border-color:var(--pink)}.who.mom{background:var(--mint-2);border-color:var(--mint)}
.card{background:var(--paper);border:3px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:16px;animation:pop .3s ease}
@keyframes pop{from{transform:translateY(8px) scale(.985)}to{transform:none}}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.chip{font:inherit;color:var(--ink);background:var(--chip);border:3px solid var(--line);border-radius:22px;padding:10px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.45;text-align:center;
  transition:transform .15s,border-color .15s,background .15s;min-height:92px;position:relative}
.chip .e{font-size:38px;line-height:1.15}
.chip small{font-weight:400;color:var(--soft);font-size:12.5px;line-height:1.5}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-2);transform:rotate(-1.5deg)}
.chip[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;left:8px;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;font-size:14px;line-height:24px}
.chip.row{flex-direction:row;justify-content:flex-start;gap:12px;text-align:start;padding:12px 14px;min-height:0}
.chip.row .e{font-size:32px}
.chip.row span:last-child{display:flex;flex-direction:column}
.sw{width:46px;height:46px;border-radius:50%;border:4px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.world{min-height:110px;border-radius:18px;width:100%;display:grid;place-items:center;font-size:30px;letter-spacing:4px}
.fontS{font-size:24px;line-height:1.6}
label.q,.q{font-weight:800;font-size:18px}
input[type=text],input[type=time],textarea{width:100%;font:inherit;color:var(--ink);background:var(--sky);border:3px solid var(--line);border-radius:18px;padding:12px 16px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--pink)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.two>div{display:flex;flex-direction:column;gap:6px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--sun-2);border:2px solid var(--sun);border-radius:99px;padding:5px 14px;cursor:pointer}
.nav{display:flex;gap:10px;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:3}
.btn{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:99px;padding:15px 24px;cursor:pointer;background:var(--pink);color:#3B1530;box-shadow:0 5px 0 #D8668C;flex:1;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D8668C}
.btn.ghost{background:var(--paper);color:var(--ink);border:3px solid var(--line);box-shadow:none;flex:0 0 auto}
.btn.mint{background:var(--mint);color:#0F3B30;box-shadow:0 5px 0 #3BA88A}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.bubble{background:var(--sun-2);border-radius:22px;padding:14px 18px;font-weight:600}
.note{background:var(--mint-2);border-radius:18px;padding:12px 16px;font-size:14.5px;line-height:1.85}
.letter{background:var(--sky);border:3px dashed var(--line);border-radius:20px;padding:16px;white-space:pre-wrap;font-size:15px;line-height:2;max-height:420px;overflow:auto}
.toast{font-size:15px;font-weight:800;color:var(--mint);min-height:1.5em;text-align:center}
.cover{display:grid;place-items:center;font-size:96px;line-height:1;padding-block:8px}
.count{font-size:13px;font-weight:800;color:var(--soft)}
/* پیش‌نمایش */
.side{display:flex;flex-direction:column;gap:8px}
.side .cap{font-size:13px;font-weight:800;color:var(--soft);text-align:center}
.pv{--a:#FF8FB1;--b:#FFC93C;--r:24px;--pf:"Lalezar";--bg:linear-gradient(#FFF3E4,#FFE0EA);--fg:#3B2A4F;--card:rgba(255,255,255,.82);
  background:var(--bg);color:var(--fg);border-radius:34px;border:6px solid var(--ink);padding:16px 14px 18px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:10px;min-height:440px;transition:background .4s}
.pv .deco{position:absolute;inset:0;pointer-events:none;font-size:26px;opacity:.55}
.pv .deco span{position:absolute}
.pv .ttl{font-family:var(--pf),"Vazirmatn",sans-serif;font-size:26px;line-height:1.3;color:var(--fg);position:relative;text-align:center;text-wrap:balance}
.pv .buddy{display:flex;align-items:center;gap:8px;position:relative}
.pv .buddy .bE{font-size:52px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.pv .buddy .bB{background:var(--card);border-radius:16px;padding:8px 12px;font-size:14px;font-weight:700;color:#3B2A4F;flex:1}
.pv .row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:8px 12px;font-size:15px;font-weight:700;color:#3B2A4F;border-inline-start:6px solid var(--a);position:relative}
.pv .row .ck{margin-inline-start:auto;width:24px;height:24px;border-radius:calc(var(--r)/2.4);border:3px solid var(--a)}
.pv .row.done .ck{background:var(--a)}
.pv .tags{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.pv .tags span{background:var(--b);color:#2B1B10;font-size:12.5px;font-weight:800;border-radius:99px;padding:2px 10px}
.pv .me{position:absolute;bottom:10px;inset-inline-start:12px;font-size:34px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (max-width:859px){.pv{min-height:0}.pv .rows{display:none}.side{order:-1}.pv .tags{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ===================== قدم‌ها ===================== */

  const tasks=[...S.tasks,...(S.taskMore.trim()?["دیگر: "+S.taskMore.trim()]:[])];
  return `سلام! من ${nm()} هستم و برنامه‌ام رو این‌طوری می‌خوام 🌸

اسمِ برنامه: ${S.app.trim()||"—"}

رنگ‌ها: ${S.color||"—"} و ${S.color2||"—"}
دنیا: ${W?W[0]:"—"}
خط: ${Fo?Fo[1]:"—"} · دکمه‌ها: ${Sh?Sh[1]:"—"} · حالت: ${S.mode||"—"}
صدای تمام شدنِ کار: ${So?So[1]:"—"}
جشنِ آخرِ روز: ${L(S.party)}

const card=document.getElementById("card"),nav=document.getElementById("nav"),who=document.getElementById("who"),prog=document.getElementById("prog");
let cur=0; try{const c=+localStorage.getItem(KEY+"-p"); if(c>=0&&c<=LAST) cur=c}catch(e){}
function render(scroll=true){
  const P=STEPS[cur];
  who.textContent=P.who; who.className="who "+(P.kid?"kid":P.mom?"mom":"");
  card.innerHTML=P.h();
  nav.innerHTML=cur===LAST?`<button class="btn ghost" data-go="${cur-1}">قبلی</button><button class="btn ghost" id="again">از اول</button>`
    :`${cur?`<button class="btn ghost" data-go="${cur-1}">قبلی</button>`:""}<button class="btn ${P.mom?"mint":""}" data-go="${cur+1}">${cur===0?"بزن بریم!":cur===LAST-1?"تموم شد!":"بعدی"}</button>`;
  prog.style.width=(cur/LAST*100)+"%";
  card.style.animation="none"; void card.offsetWidth; card.style.animation="";
  preview(); try{localStorage.setItem(KEY+"-p",cur)}catch(e){}
  if(cur===LAST) party();
  if(scroll) window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("input",e=>{const id=e.target.id; if(id in S&&typeof S[id]==="string"){S[id]=e.target.value; save(); preview()}});
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip[data-k]");
  if(c){const k=c.dataset.k,v=c.dataset.v;
    if(c.dataset.m==="1"){const i=S[k].indexOf(v),max=+c.dataset.max;
      if(i>=0) S[k].splice(i,1); else { if(max&&S[k].length>=max) S[k].shift(); S[k].push(v); spark(c)}
      if(k==="features") S.top=S.top.filter(x=>S.features.includes(x));
    } else { S[k]=S[k]===v?"":v; if(S[k]) spark(c) }
    if(k==="sound"&&S.sound) play(S.sound);
    save(); render(false); return}
  const f=e.target.closest("[data-fill]");
  if(f){S[f.dataset.fill]=f.dataset.val; save(); render(false); return}
  const g=e.target.closest("[data-go]");
  if(g){cur=+g.dataset.go; render(); return}
  if(e.target.id==="copy"){const t=document.getElementById("toast"),body=letter();
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("letter"));const s=getSelection();s.removeAllRanges();s.addRange(r);
      try{document.execCommand("copy");t.textContent="کپی شد! حالا توی دایرکتِ اینستاگرام بچسبون."}catch(x){t.textContent="متن انتخاب شد؛ «کپی» رو بزن."}};
    if(navigator.clipboard) navigator.clipboard.writeText(body).then(()=>t.textContent="کپی شد! حالا توی دایرکتِ اینستاگرام بچسبون.").catch(fallback); else fallback();
    return}
  if(e.target.id==="send"){const b=e.target,t=document.getElementById("toast");b.disabled=true;b.textContent="دارم می‌فرستم…";
    fetch("https://ntfy.sh/",{method:"POST",body:JSON.stringify({topic:TOPIC,title:"کادو: سلیقهٔ "+nm(),message:letter().slice(0,1900),tags:["gift"]})})
      .then(r=>{if(!r.ok) throw 0; b.textContent="فرستاده شد! 💌"; t.textContent="رسید! دوستمون به‌زودی برنامه رو می‌سازه."; S.sent=Date.now(); save(); party()})
      .catch(()=>{b.disabled=false;b.textContent="💌 دوباره بفرست";t.textContent="فرستاده نشد. اینترنت رو بسنج و دوباره بزن، یا نامه رو کپی کن.";});
    return}
  if(e.target.id==="again"){const keep=S.name; S=fresh(); S.name=keep; save(); cur=0; render()}
});

/* ===================== صدا ===================== */
let AC=null;
function play(kind){
  if(kind==="none") return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); AC.resume&&AC.resume()}catch(e){return}
  const t0=AC.currentTime;
  const tone=(f,st,d,type="sine",g=.25,f2)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0+st);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+st+d);
    v.gain.setValueAtTime(0,t0+st);v.gain.linearRampToValueAtTime(g,t0+st+.01);v.gain.exponentialRampToValueAtTime(.001,t0+st+d);o.connect(v).connect(AC.destination);o.start(t0+st);o.stop(t0+st+d+.05)};
  ({piano:()=>[523,659,784].forEach((f,i)=>tone(f,i*.12,.5,"triangle")),
    bell:()=>{tone(1318,0,.8,"sine",.2);tone(1760,.08,.7,"sine",.12)},
    bird:()=>[0,.12,.24].forEach(s=>tone(2200,s,.09,"sine",.15,3400)),
    bubble:()=>[0,.1,.2].forEach((s,i)=>tone(300+i*120,s,.12,"sine",.3,900+i*200)),
    drum:()=>{tone(140,0,.25,"sine",.6,50);tone(140,.18,.25,"sine",.6,50)},
    magic:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,i*.07,.4,"sine",.15))})[kind]?.();
}

const cv=document.getElementById("fx"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function boom(x,y,n,sp,cols){
  if(still) return; cv.width=innerWidth;cv.height=innerHeight;
  cols=cols||["#FF8FB1","#FFC93C","#5CCFB0","#A77BFF","#4FAEF0"];
  const ps=Array.from({length:n},()=>({x,y,vx:(Math.random()-.5)*sp,vy:-Math.random()*sp-2,r:3+Math.random()*4,c:cols[Math.random()*cols.length|0],a:1}));
  (function f(){cx.clearRect(0,0,cv.width,cv.height);let live=0;
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.a-=.012;if(p.a>0){live++;cx.globalAlpha=p.a;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}});
    cx.globalAlpha=1;live?requestAnimationFrame(f):cx.clearRect(0,0,cv.width,cv.height)})();
}
function spark(el){const r=el.getBoundingClientRect();boom(r.left+r.width/2,r.top+r.height/2,16,6,[colorHex(S.color)||"#FF8FB1",colorHex(S.color2)||"#FFC93C","#FFFFFF"])}
